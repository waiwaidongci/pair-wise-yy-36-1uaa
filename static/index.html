<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业排污许可与超标处置</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto;white-space:pre-wrap}button{padding:.55rem 1rem;margin:.2rem .2rem .2rem 0}input{padding:.5rem;width:8rem}</style></head><body><h1>企业排污许可与超标处置</h1><p>汇总监测和工况，判断排放超标并跟踪复测、整改、执法与复查</p><p>按浓度与许可限值计算超标倍数，异常读数先进入评估；关闭前必须没有未完成整改项。复查阶段须由合规员确认材料编号与事件版本；确认后再补材料会令确认立即失效，关闭返回409并提示重新确认。</p><div><input id="itemId" type="number" min="1" placeholder="事件ID"><button onclick="loadItems()">刷新列表</button><button onclick="showDetail()">查看详情</button><button onclick="confirmReview()">复查确认(合规员)</button><button onclick="addMaterial()">补充材料(operator)</button><button onclick="closeItem()">关闭(director)</button></div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
let current=null;
const out=document.getElementById('out');
function show(v){out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
function itemId(){const v=parseInt(document.getElementById('itemId').value,10);if(!v)throw new Error('请先填写事件ID');return v}
async function api(path,role,opts){opts=opts||{};const headers=Object.assign({'X-Actor':'demo','X-Role':role},opts.headers||{});const r=await fetch(path,{method:opts.method||'GET',headers:headers,body:opts.body});const body=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(body.message||r.statusText);e.status=r.status;throw e}return body}
async function loadItems(){try{show(await api('/api/items','viewer'))}catch(e){show(e.message)}}
async function detail(){current=await api('/api/items/'+itemId(),'viewer');return current}
async function showDetail(){try{const it=await detail();show('能否关闭: '+(it.can_close?'是':'否')+'\n最近确认批次: '+(it.latest_confirmation_batch===null?'无':it.latest_confirmation_batch)+'\n阻塞原因: '+((it.close_blockers||[]).join('；')||'无')+'\n\n'+JSON.stringify(it,null,2))}catch(e){show(e.message)}}
async function confirmReview(){try{const r=await api('/api/items/'+itemId()+'/confirm-review','compliance_officer',{method:'POST',body:'{}'});show((r.created?'已新建确认批次 ':'同一批重复确认，未新增批次 ')+r.confirmation.id+'\n'+JSON.stringify(r.confirmation,null,2))}catch(e){show('确认失败('+(e.status||'')+')：'+e.message)}}
async function addMaterial(){const text=window.prompt('补充材料说明','现场补充监测材料');if(text===null)return;try{const r=await api('/api/items/'+itemId()+'/records','operator',{method:'POST',body:JSON.stringify({kind:'material',detail:text,status:'closed'})});show('已补充材料 #'+r.id+'，原复查确认已失效，需重新确认')}catch(e){show('补充材料失败('+(e.status||'')+')：'+e.message)}}
async function closeItem(){try{const it=await detail();await api('/api/items/'+it.id+'/transition','director',{method:'POST',body:JSON.stringify({target:'closed',expected_version:it.version})});show('已关闭')}catch(e){show('关闭被阻止('+(e.status||'')+')：'+e.message)}}
</script></body></html>
